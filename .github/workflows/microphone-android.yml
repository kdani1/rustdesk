name: Experimental microphone Android client

on:
  workflow_dispatch:
  push:
    branches: [build/microphone-android]

permissions:
  contents: read

concurrency:
  group: microphone-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-microphone
      RUST_LOG: info
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libasound2-dev libpulse-dev libgtk-3-dev libxdo-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libva-dev libunwind-dev nasm ninja-build pkg-config openjdk-17-jdk-headless autoconf automake libtool
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: ~/.cache/vcpkg/archives
          key: microphone-android-vcpkg-r28c-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}
      - name: Prepare native dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 9e593bb18ea69cc5095e012465dcd675a822ed0d
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          ./flutter/build_android_deps.sh arm64-v8a
      - name: Preserve completed native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/vcpkg/archives
          key: microphone-android-vcpkg-r28c-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: microphone-android
          cache-on-failure: true
      - name: Generate Flutter bridge
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - name: Build Android Rust library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version 3.1.2 --locked
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android"
          ./flutter/ndk_arm64.sh
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" flutter/android/app/src/main/jniLibs/arm64-v8a/
      - name: Build APK for local release signing
        run: |
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx3g/' flutter/android/gradle.properties
          sed -i 's/signingConfigs.release/signingConfigs.debug/' flutter/android/app/build.gradle
          (cd flutter && flutter build apk --release --target-platform android-arm64 --split-per-abi --build-number "${{ github.run_number }}")
          mkdir -p android-artifact
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk android-artifact/ci-only-resign-before-distribution.apk
          cp docs/microphone/ANDROID.hu.md android-artifact/
          printf '%s\n' '${{ github.sha }}' > android-artifact/SOURCE_COMMIT.txt
          SDK_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose android-artifact/ci-only-resign-before-distribution.apk
          cp "$SDK_BUILD_TOOLS/lib/apksigner.jar" android-artifact/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-microphone-android-arm64-${{ github.sha }}
          path: android-artifact/
          if-no-files-found: error
          retention-days: 14
