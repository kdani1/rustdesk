name: Experimental microphone Windows client

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'libs/base/**'
      - 'flutter/**'
      - '.github/workflows/microphone-windows.yml'

permissions:
  contents: read

concurrency:
  group: microphone-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/remote-microphone'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_ROOT: C:\vcpkg-microphone
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      RUST_LOG: info
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: '3.24.5'
          channel: stable
          architecture: x64
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: '15.0.6'
      - name: Prepare native dependencies
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout 9e593bb18ea69cc5095e012465dcd675a822ed0d
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static "--x-install-root=$env:VCPKG_ROOT/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate Flutter bridge
        shell: pwsh
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location flutter
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable application folder
        shell: pwsh
        run: |
          python build.py --portable --flutter --skip-portable-pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = 'flutter/build/windows/x64/runner/Release'
          if (!(Test-Path "$app/rustdesk.exe")) { throw 'Missing application executable' }
          if (!(Test-Path "$app/librustdesk.dll")) { throw 'Missing Rust library' }
          Copy-Item docs/microphone/README.hu.md "$app/MICROPHONE-README.hu.md"
          Copy-Item docs/microphone/TESTING.md "$app/MICROPHONE-TESTING.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-microphone-windows-x64-${{ github.sha }}
          path: flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
